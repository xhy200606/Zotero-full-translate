services:
  zft:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ""
        VITE_ADMIN_API_BASE_URL: ""
        USER_FRONTEND_REV: ${ZFT_USER_FRONTEND_REV:-dev}
        ADMIN_FRONTEND_REV: ${ZFT_ADMIN_FRONTEND_REV:-dev}
    image: zotero-full-translate-cloud:2.5.0
    container_name: zotero-full-translate-cloud
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/zft.db
      ZFT_STORAGE_DIR: /data/files
      ZFT_WORK_DIR: /data/work
      ZFT_STATIC_DIR: /app/static/user
      ZFT_ADMIN_STATIC_DIR: /app/static/admin
      ZFT_ADMIN_PORT: ${ZFT_ADMIN_PORT:-3006}
    ports:
      - "${ZFT_BIND:-0.0.0.0}:${ZFT_PORT:-3005}:8089"
      - "${ZFT_ADMIN_BIND:-127.0.0.1}:${ZFT_ADMIN_PORT:-3006}:8089"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - zft_data:/data
      - ./backend/app:/app/app:ro
      - ./backend/alembic:/app/alembic:ro
      - ./backend/alembic.ini:/app/alembic.ini:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8089/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  zft_data:
